<title>Tridosha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: app shell — grouped side navigation on wide screens, bottom tabs on phones; one reading column of panels. */

}

  --ink: #ece8d6; --ink-2: #b1b8a2; --ink-3: #868d79;
  --sage: #93af7e; --primary: #a9c693; --on-primary: #141912;
  --orange: #e08a52; --gold: #d1b262; --gold-soft: #3a3420;
  --vata: #8db0d4; --pitta: #e08a52; --kapha: #93b77f;
  --vata-soft: #22303b; --pitta-soft: #3b2a1e; --kapha-soft: #26331f;
  --alert: #ef9a86; --alert-soft: #3d2019; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141912; --surface: #1c2319; --surface-2: #262e22; --line: #37412f;
  --ink: #ece8d6; --ink-2: #b1b8a2; --ink-3: #868d79;

.btn[disabled] { opacity: .5; cursor: not-allowed }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: .86rem; font-weight: 600; color: var(--ink-2); min-width: 0 }
input[type=text], input[type=number], input[type=time], input[type=date], input[type=search], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 11px; width: 100%; min-width: 0; font-weight: 400; color: var(--ink) }
textarea { resize: vertical; min-height: 84px; line-height: 1.45 }
input:focus, select:focus, textarea:focus { border-color: var(--sage); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sage) 25%, transparent) }
.chips { display: flex; flex-wrap: wrap; gap: 7px }

.seg button { border: 0; background: transparent; padding: 7px 11px; font-size: .84rem; font-weight: 500; cursor: pointer; border-right: 1px solid var(--line); color: var(--ink-2) }

.banner { background: var(--gold-soft); border-bottom: 1px solid var(--line); padding: 9px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: .88rem }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 10px }

.tablewrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm) }
table { border-collapse: collapse; width: 100%; font-size: .9rem }

.foodrow { display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(4.6rem, .6fr)) auto; gap: 8px 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); background: transparent; border-inline: 0; border-top: 0; width: 100%; text-align: left; cursor: pointer }
.foodrow:hover { background: var(--surface-2) }
.foodrow[aria-expanded="true"] { background: var(--surface-2) }
.foodlist { border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--surface) }
.fooddetail { padding: 16px; border-bottom: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 14px }
.chart { width: 100%; height: auto; display: block }
.chart text { font-family: var(--body); font-size: 11px; fill: var(--ink-2) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--ink-2) }

.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: clamp(18px, 4vw, 44px); align-items: center }

.plan > div { padding: 10px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 0 }
.plan > div:nth-child(4n) { border-right: 0 }
.plan .h { background: var(--surface-2); font-size: .74rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2) }
.code { background: var(--surface-2); border-radius: var(--r-sm); padding: 14px; overflow-x: auto; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: .78rem; line-height: 1.5; white-space: pre; max-height: 420px }
#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .9rem; font-weight: 600; box-shadow: var(--shadow); z-index: 60; max-width: calc(100vw - 32px); text-align: center }
.sheet { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--ink) 45%, transparent); display: flex; align-items: flex-end }
.sheet > div { background: var(--surface); width: 100%; max-height: 82vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { display: none }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 20 }

  .foot { padding-bottom: 96px }
  .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 30 }

  .tabs [aria-current="page"] { color: var(--primary); background: var(--surface-2) }

}
@media (min-width: 901px) { .foodrow .effs { display: contents } }

/* Hosted build: account and profile screens */
.app.locked { grid-template-columns: minmax(0, 1fr) }
.app.locked .side, .app.locked .tabs { display: none }
.gate { max-width: 27rem; width: 100%; margin: 4vh auto 0 }
.gate .brand { justify-content: center; padding-bottom: 8px }
</style>

<div class="app">
  <aside class="side" id="side" aria-label="Sections"></aside>
  <div class="main">
    <header class="topbar"><a class="brand" href="#home" id="brandTop"></a><span class="status" id="statusTop"></span></header>
